name: Phigros 全量发布

# 唯一工作流：手动触发，完成 下载最新 APK → 全量解包（含全曲音乐）→ 全量上传。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phigros-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 下载-全量解包-全量上传
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 平台上限 6 小时：runner 在海外，跨境下载/上传都慢，留足余量
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: 安装音频重建系统库（libogg / libvorbis）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libogg0 libvorbis0a

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 下载并全量解包并全量上传
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
          # 可选：在 Settings → Variables 里建 S3_UPLOAD_WORKERS 调整并行上传线程数（默认 8）
          S3_UPLOAD_WORKERS: ${{ vars.S3_UPLOAD_WORKERS }}
        run: python publish.py

      - name: 归档发布清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phigros-release-manifests
          path: work/artifacts/
          if-no-files-found: ignore
          retention-days: 30
